<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente de Revisión</title>
</head>
<body style="font-family: 'Segoe UI', sans-serif; background: #f4f6f8; margin: 0; padding: 2rem;">
  <div style="max-width: 900px; margin: auto; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2>🛠️ Asistente de Revisión de Informes de Accidentes</h2>

    <textarea id="texto" rows="8" placeholder="Pega o escribe el contenido del informe..." style="width: 100%; padding: 1rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid #ccc; font-family: monospace;"></textarea>

    <input type="file" id="archivo" accept=".pdf" />
    <br /><br />
    <button id="btnResumen" style="padding: 0.5rem 1rem; margin-right: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">✏️ Generar resumen</button>
    <button id="btnRevisar" style="padding: 0.5rem 1rem; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer;">🧐 Revisar técnicamente</button>

    <div id="resultado" style="margin-top: 1.5rem; background: #f9f9f9; border-left: 5px solid #007bff; padding: 1rem; border-radius: 5px;">
      <strong>📂 Resultado:</strong>
      <div id="resultadoContenido" style="margin-top: 0.5rem;"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <script>
    const btnResumen = document.getElementById("btnResumen");
    const btnRevisar = document.getElementById("btnRevisar");
    const archivo = document.getElementById("archivo");
    const resultado = document.getElementById("resultadoContenido");

    function mostrarCargando(mensaje) {
      resultado.innerHTML = `<p style="font-style: italic; color: gray;">${mensaje}</p>`;
    }

    async function obtenerTexto() {
      const texto = document.getElementById("texto").value.trim();
      if (texto) return texto;
      if (!archivo.files.length) return "";

      const pdf = archivo.files[0];
      const arrayBuffer = await pdf.arrayBuffer();
      const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let textoCompleto = "";

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const page = await pdfDoc.getPage(i);
        const content = await page.getTextContent();
        textoCompleto += content.items.map(i => i.str).join(" ") + "\n";
      }
      return textoCompleto;
    }

    btnResumen.addEventListener("click", async () => {
      const texto = await obtenerTexto();
      if (!texto) return alert("Falta contenido.");
      mostrarCargando("✏️ Generando resumen...");

      const respuesta = await fetch("/resumir", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto }),
      });
      const datos = await respuesta.json();
      resultado.innerHTML = `<pre>${datos.resumen}</pre>`;
    });

    btnRevisar.addEventListener("click", async () => {
      const texto = await obtenerTexto();
      if (!texto) return alert("Falta contenido.");
      mostrarCargando("🔄 Revisando técnicamente el informe...");

      const respuesta = await fetch("/analizar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto }),
      });
      const datos = await respuesta.json();
      resultado.innerHTML = `<pre>${datos.revision}</pre>`;
    });
  </script>
</body>
</html>
