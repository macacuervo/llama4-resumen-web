<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente de Revisión de Informes</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 150px;
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      padding: 10px 20px;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .resultado {
      margin-top: 20px;
    }
    pre {
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      padding: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
      border-radius: 6px;
    }
    .file-input {
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🛠️ Asistente de Revisión de Informes de Accidentes</h2>
    <textarea id="texto" placeholder="Pega o escribe el contenido del informe..."></textarea>
    <div class="file-input">
      <input type="file" id="archivo" accept="application/pdf">
    </div>
    <button onclick="resumir()">📝 Generar resumen</button>
    <button onclick="analizar()">🕵️ Revisar técnicamente</button>
    <div class="resultado">
      <h3>📂 Resultado:</h3>
      <div id="resultado"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script>
    const textarea = document.getElementById("texto");
    const input = document.getElementById("archivo");

    input.addEventListener("change", async () => {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        const typedarray = new Uint8Array(reader.result);
        const pdf = await pdfjsLib.getDocument({ data: typedarray }).promise;
        let text = "";
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          const strings = content.items.map((item) => item.str);
          text += strings.join(" ") + "\n";
        }
        textarea.value = text;
      };
      reader.readAsArrayBuffer(file);
    });

    async function resumir() {
      const res = await fetch("/resumir", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto: textarea.value })
      });
      const data = await res.json();
      document.getElementById("resultado").innerHTML = `<pre>${data.resumen}</pre>`;
    }

    async function analizar() {
      const res = await fetch("/analizar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto: textarea.value })
      });
      const data = await res.json();
      document.getElementById("resultado").innerHTML = data.revision;
    }
  </script>
</body>
</html>
